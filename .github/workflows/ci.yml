name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          # The .NET 8 runtime runs the net8.0 tests
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet pack src/Crudy.Randomizer --configuration Release --output nupkg $VERSION_ARG

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/

  # Push a tag like v1.2.0 to publish version 1.2.0 to nuget.org.
  # Needs a NUGET_API_KEY repository secret (nuget.org > API Keys, scoped to Crudy.Randomizer).
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Push to nuget.org
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
